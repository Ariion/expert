# =============================================================================
# Ordonnanceur gratuit — alternative au plan Vercel Pro.
#
# Vercel déclenche les crons de `vercel.json` à la minute uniquement sur le
# plan Pro. Sur le plan Hobby (gratuit), ce workflow fait le même travail sans
# rien coûter : GitHub Actions appelle les mêmes routes HTTP.
#
# MISE EN ROUTE (2 minutes, une seule fois) :
#   Repo GitHub > Settings > Secrets and variables > Actions > New secret
#     CRON_SECRET  = la même valeur que celle utilisée par « 1. Installation »
#
# L'adresse du site n'a pas à être renseignée : « 1. Installation » la publie
# dans .github/app-url.txt. Un secret APP_URL, s'il existe, reste prioritaire
# (utile le jour où vous branchez un nom de domaine personnalisé).
#
# Ne rien faire d'autre : le workflow tourne ensuite tout seul.
# (GitHub peut décaler un déclenchement de quelques minutes en cas de charge —
#  sans conséquence : chaque job est idempotent et rattrape son retard.)
# =============================================================================
name: 3. Automatisation (collecte et alertes)

on:
  schedule:
    - cron: "*/5 * * * *"   # collecte des incidents + envoi des alertes
    - cron: "17 3 * * *"    # agrégats de disponibilité + digests quotidiens
    - cron: "42 4 * * *"    # réconciliation Stripe, purge, watchdog
  workflow_dispatch:
    inputs:
      job:
        description: "Job à déclencher manuellement"
        required: true
        default: ingest
        type: choice
        options: [ingest, dispatch, rollup, reconcile]

concurrency:
  group: upstreamstatus-cron
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Déterminer l'adresse du site
        id: target
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # Un secret se colle depuis un tableau de bord : il arrive avec des
          # espaces, parfois sans protocole. Le fichier de secours était déjà
          # nettoyé, le secret ne l'était pas — et une espace en tête suffit à
          # faire rejeter l'adresse par curl, donc à couper toute la collecte.
          URL="$(printf '%s' "$APP_URL" | tr -d '[:space:]')"
          if [ -z "$URL" ] && [ -f .github/app-url.txt ]; then
            URL="$(tr -d '[:space:]' < .github/app-url.txt)"
          fi
          case "$URL" in
            http://*|https://*) ;;
            "") ;;
            *) URL="https://$URL" ;;
          esac
          URL="${URL%/}"
          if [ -z "$URL" ]; then
            echo "::error::Adresse du site introuvable. Lancez « 1. Installation », ou ajoutez un secret APP_URL."
            exit 1
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Secret CRON_SECRET à renseigner dans Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Cible : $URL"

      - name: Déclencher les jobs
        env:
          APP_URL: ${{ steps.target.outputs.url }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SCHEDULE: ${{ github.event.schedule }}
          MANUAL: ${{ inputs.job }}
        run: |
          set -u
          case "$SCHEDULE" in
            "17 3 * * *") JOBS="rollup" ;;
            "42 4 * * *") JOBS="reconcile" ;;
            "*/5 * * * *") JOBS="ingest dispatch" ;;
            *) JOBS="${MANUAL:-ingest}" ;;
          esac

          FAILED=0
          for JOB in $JOBS; do
            echo "── $JOB"
            # --location-trusted et non -L : un apex qui redirige vers son www
            # change d'hôte, et curl retire alors l'en-tête d'autorisation par
            # sécurité — la tâche recevrait un 401 au lieu du 308. La
            # destination est décidée par notre propre configuration de
            # domaine, donc lui transmettre la clé ne l'expose à personne
            # d'autre. Sans ceci, une simple bascule apex/www coupe toute la
            # collecte en silence : c'est exactement ce qui est arrivé.
            # Un seul appel : le code ET l'adresse finalement atteinte sortent
            # de la même requête. Refaire une requête pour savoir où l'on a
            # atterri déclencherait la tâche deux fois par tick — collecte en
            # double, et alertes potentiellement dupliquées.
            OUT=$(curl -sS -o /tmp/out.json -w "%{http_code} %{url_effective}" --max-time 300 \
                    --location-trusted --max-redirs 3 \
                    -H "authorization: Bearer $CRON_SECRET" \
                    "$APP_URL/api/cron/$JOB" || echo "000 ")
            CODE="${OUT%% *}"
            FINAL="${OUT#* }"
            echo "HTTP $CODE"
            head -c 600 /tmp/out.json; echo
            # La tâche aboutit malgré la redirection, mais on le signale :
            # sinon personne ne corrige l'adresse, et le jour où le site ne
            # redirige plus, tout s'arrête sans prévenir.
            case "$FINAL" in
              "$APP_URL/api/cron/$JOB"|"") ;;
              *) echo "::warning::APP_URL redirige vers ${FINAL%/api/cron/*}. Mettez le secret APP_URL à cette valeur." ;;
            esac
            # Une erreur serveur est déjà signalée par l'alerting interne ;
            # on fait quand même échouer le run pour qu'elle soit visible ici.
            [ "$CODE" = "200" ] || FAILED=1
          done
          exit $FAILED
