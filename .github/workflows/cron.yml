# =============================================================================
# Ordonnanceur gratuit — alternative au plan Vercel Pro.
#
# Vercel déclenche les crons de `vercel.json` à la minute uniquement sur le
# plan Pro. Sur le plan Hobby (gratuit), ce workflow fait le même travail sans
# rien coûter : GitHub Actions appelle les mêmes routes HTTP.
#
# MISE EN ROUTE (2 minutes, une seule fois) :
#   Repo GitHub > Settings > Secrets and variables > Actions > New secret
#     CRON_SECRET  = la même valeur que celle utilisée par « 1. Installation »
#
# L'adresse du site n'a pas à être renseignée : « 1. Installation » la publie
# dans .github/app-url.txt. Un secret APP_URL, s'il existe, reste prioritaire
# (utile le jour où vous branchez un nom de domaine personnalisé).
#
# Ne rien faire d'autre : le workflow tourne ensuite tout seul.
# (GitHub peut décaler un déclenchement de quelques minutes en cas de charge —
#  sans conséquence : chaque job est idempotent et rattrape son retard.)
# =============================================================================
name: 3. Automatisation (collecte et alertes)

on:
  schedule:
    - cron: "*/5 * * * *"   # collecte des incidents + envoi des alertes
    - cron: "17 3 * * *"    # agrégats de disponibilité + digests quotidiens
    - cron: "42 4 * * *"    # réconciliation Stripe, purge, watchdog
  workflow_dispatch:
    inputs:
      job:
        description: "Job à déclencher manuellement"
        required: true
        default: ingest
        type: choice
        options: [ingest, dispatch, rollup, reconcile]

concurrency:
  group: statuspulse-cron
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Déterminer l'adresse du site
        id: target
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          URL="$APP_URL"
          if [ -z "$URL" ] && [ -f .github/app-url.txt ]; then
            URL="$(tr -d '[:space:]' < .github/app-url.txt)"
          fi
          if [ -z "$URL" ]; then
            echo "::error::Adresse du site introuvable. Lancez « 1. Installation », ou ajoutez un secret APP_URL."
            exit 1
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Secret CRON_SECRET à renseigner dans Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Cible : $URL"

      - name: Déclencher les jobs
        env:
          APP_URL: ${{ steps.target.outputs.url }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SCHEDULE: ${{ github.event.schedule }}
          MANUAL: ${{ inputs.job }}
        run: |
          set -u
          case "$SCHEDULE" in
            "17 3 * * *") JOBS="rollup" ;;
            "42 4 * * *") JOBS="reconcile" ;;
            "*/5 * * * *") JOBS="ingest dispatch" ;;
            *) JOBS="${MANUAL:-ingest}" ;;
          esac

          FAILED=0
          for JOB in $JOBS; do
            echo "── $JOB"
            CODE=$(curl -sS -o /tmp/out.json -w "%{http_code}" --max-time 300 \
                    -H "authorization: Bearer $CRON_SECRET" \
                    "$APP_URL/api/cron/$JOB" || echo "000")
            echo "HTTP $CODE"
            head -c 600 /tmp/out.json; echo
            # Une erreur serveur est déjà signalée par l'alerting interne ;
            # on fait quand même échouer le run pour qu'elle soit visible ici.
            [ "$CODE" = "200" ] || FAILED=1
          done
          exit $FAILED
